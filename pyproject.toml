[project]
name = "rentok-llm-gateway"
version = "1.0.0"
description = "Minimal Production LLM Gateway with virtual keys, budget enforcement, fallback, and caching"
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

